<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="legGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B83A2D"/>
    </linearGradient>
  </defs>
  
  <!-- Deep premium black squircle -->
  <rect width="120" height="120" rx="28" fill="#050505" />
  
  <g transform="translate(30, 26)">
    <!-- Vertical stem -->
    <rect x="0" y="0" width="16" height="64" rx="3" fill="#FFFFFF" />
    
    <!-- Top Loop -->
    <path d="M 8,8 H 32 C 46,8 52,14 52,24 C 52,34 46,40 32,40 H 8" fill="none" stroke="#FFFFFF" stroke-width="16" />
    
    <!-- Diagonal Leg -->
    <path d="M 28,38 L 50,64" stroke="url(#legGlow)" stroke-width="16" stroke-linecap="round" />
  </g>
</svg>
