<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <!-- Brutalist Crimson Singularity (Strictly Red/Black/White) -->
    <radialGradient id="coreGlow" cx="25%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" />    <!-- Blinding Core -->
      <stop offset="20%" stop-color="#FF1E1E" />   <!-- Pure Aggressive Red -->
      <stop offset="60%" stop-color="#550000" />   <!-- Deep Blood Shadow -->
      <stop offset="100%" stop-color="#000000" />  <!-- Vantablack Fade -->
    </radialGradient>
    
    <!-- Razor-Sharp Silver/Red Refraction -->
    <linearGradient id="glassEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="35%" stop-color="#FF1E1E" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Premium Pitch-Black Squircle -->
  <rect width="120" height="120" rx="28" fill="#000000" />
  
  <!-- Base Crimson Sphere (The Aura) -->
  <circle cx="60" cy="60" r="38" fill="url(#coreGlow)" />
  
  <!-- Massive Dark Matter Void (Creates the 3D Eclipse cut) -->
  <circle cx="76" cy="76" r="42" fill="#000000" />
  
  <!-- Glassmorphic Refraction Edge -->
  <circle cx="60" cy="60" r="38" fill="none" stroke="url(#glassEdge)" stroke-width="2" />
  
  <!-- Bespoke 4-Point Lens Flare (The Spark) -->
  <g transform="translate(33, 33)">
    <!-- Subtle red halo -->
    <circle cx="0" cy="0" r="6" fill="#FF1E1E" opacity="0.4" />
    <!-- Sharp geometric anime star glint -->
    <path d="M 0,-9 Q 0,0 9,0 Q 0,0 0,9 Q 0,0 -9,0 Q 0,0 0,-9 Z" fill="#FFFFFF" />
  </g>
</svg>
