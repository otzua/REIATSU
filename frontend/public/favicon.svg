<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="crescentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#444444"/>
    </linearGradient>
  </defs>
  
  <!-- Pure pitch-black squircle -->
  <rect width="120" height="120" rx="28" fill="#000000" />
  
  <!-- Ethereal Orbital Ring (The Aura) -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.15" />
  
  <!-- Crescent Singularity (The Pressure) -->
  <mask id="moonMask">
    <circle cx="60" cy="60" r="32" fill="white" />
    <circle cx="72" cy="48" r="34" fill="black" />
  </mask>
  <circle cx="60" cy="60" r="32" fill="url(#crescentGrad)" mask="url(#moonMask)" />
  
  <!-- The Crimson Reiatsu Core -->
  <circle cx="72" cy="48" r="5" fill="#E50914" />
</svg>
