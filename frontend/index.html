<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REIATSU</title>
    <meta name="description" content="Stream your favorite anime in high definition with Reiatsu. Fast, stable, and beautiful." />

    <!-- Glassmorphism Production Fix: SVG Blur Engine -->
    <svg style="display: none;">
      <filter id="glass-blur" color-interpolation-filters="sRGB">
        <feGaussianBlur stdDeviation="20" edgeMode="duplicate" />
      </filter>
    </svg>
